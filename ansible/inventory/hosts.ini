# Ansible Inventory for CCNA Lab
# Groups devices by type for easier management

[routers]
router891 ansible_host=192.168.2.11

[layer3_switches]
switch3560cx ansible_host=192.168.2.35

[layer2_switches]
switch2960cx ansible_host=192.168.2.29
switch2960s_1 ansible_host=192.168.2.21
switch2960s_2 ansible_host=192.168.2.22

[switches:children]
layer3_switches
layer2_switches

[all:vars]
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios
ansible_user=admin
# Use SSH key authentication (recommended)
ansible_ssh_private_key_file=~/.ssh/id_ed25519
# Uncomment below and comment ssh_private_key_file to use password
# ansible_password=your_password_here
# ansible_become_password=your_password_here
