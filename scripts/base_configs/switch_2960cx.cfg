! Base configuration for Cisco 2960CX
! This config restores basic management settings only.
! It does NOT modify usernames, passwords, or SSH keys.
hostname Switch2960CX
!
vlan 99
 name Management
!
interface Vlan99
 ip address dhcp
 no shutdown
!
ip default-gateway 192.168.2.1
!
line vty 0 4
 transport input ssh
 login local
!
end
