! Base configuration for Cisco 891
! This config restores basic management settings only.
! It does NOT modify usernames, passwords, or SSH keys.
hostname Router891
!
interface FastEthernet0
 ip address 192.168.2.11 255.255.255.0
 no shutdown
!
ip domain-name homelab
!
line vty 0 4
 transport input ssh
 login local
!
end
