! Base configuration for Cisco 891
! Replace this content with your actual clean, management-enabled configuration
hostname Router891
!
interface FastEthernet0
 ip address 192.168.2.11 255.255.255.0
 no shutdown
!
ip domain-name homelab
crypto key generate rsa setup
!
username admin privilege 15 secret replace_with_your_password
!
line vty 0 4
 transport input ssh
 login local
!
end
