! Base configuration for Cisco 3560CX
! This config restores basic management settings only.
! It does NOT modify usernames, passwords, or SSH keys.
hostname Switch3560CX
!
vlan 99
 name Management
!
interface Vlan99
 ip address 192.168.2.35 255.255.255.0
 no shutdown
!
line vty 0 4
 transport input ssh
 login local
!
end
