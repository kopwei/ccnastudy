! Base configuration for Cisco 3560CX
! Replace this content with your actual clean, management-enabled configuration
hostname Switch3560CX
!
vlan 99
 name Management
!
interface GigabitEthernet1/0/10
 switchport access vlan 99
 switchport mode access
 no shutdown
!
interface Vlan99
 ip address 192.168.2.35 255.255.255.0
 no shutdown
!
username admin privilege 15 secret replace_with_your_password
!
line vty 0 4
 transport input ssh
 login local
!
end
