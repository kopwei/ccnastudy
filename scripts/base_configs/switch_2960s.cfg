! Base configuration for Cisco 2960S
! Replace this content with your actual clean, management-enabled configuration
hostname Switch2960S
!
interface FastEthernet0
 ip address 192.168.2.21 255.255.255.0
 ! Note: Adjust IP for the second switch (192.168.2.22)
 no shutdown
!
username admin privilege 15 secret replace_with_your_password
!
line vty 0 4
 transport input ssh
 login local
!
end
